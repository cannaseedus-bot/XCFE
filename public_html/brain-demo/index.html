<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>XJSON Brain Demo</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <header>
    <h1>XJSON Brain — Graph-Walk Inference</h1>
    <p class="subhead">Offline-capable graph inference with federation overlays and full-brain sync.</p>
  </header>

  <section class="controls">
    <label>
      Prompt
      <input id="prompt" placeholder="Enter instruction…" />
    </label>
    <label>
      Active brain
      <select id="activeBrain">
        <option value="local">Local</option>
      </select>
    </label>
    <button id="btnInfer">Infer</button>
  </section>

  <section class="canvas">
    <svg id="brain-svg" width="900" height="520" role="img" aria-label="Brain visualization"></svg>
  </section>

  <section class="output">
    <h2>Inference Output</h2>
    <pre id="output"></pre>
  </section>

  <section class="p2p">
    <h2>P2P Brain Sync (WebRTC)</h2>

    <div class="row">
      <button id="btnHost">Host</button>
      <button id="btnJoin">Join</button>
      <button id="btnSendBrain" disabled>Send brain.scxq2.bin</button>
    </div>

    <div class="grid">
      <div>
        <h3>Local SDP</h3>
        <textarea id="localSDP" rows="10" placeholder="(generated)"></textarea>
        <button id="btnCopyLocal">Copy</button>
      </div>
      <div>
        <h3>Remote SDP</h3>
        <textarea id="remoteSDP" rows="10" placeholder="Paste remote SDP here"></textarea>
        <button id="btnSetRemote">Set Remote</button>
      </div>
    </div>

    <pre id="p2pLog"></pre>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
