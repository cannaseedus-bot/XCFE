<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">XJSON Logo</title>
  <desc id="desc">A stylized X inside JSON braces forming a compact logo.</desc>

  <!-- Background -->
  <rect x="0" y="0" width="256" height="256" rx="32" fill="#0B1020"/>

  <!-- Braces -->
  <path d="M74 64
           c-10 0-18 8-18 18v24
           c0 10-4 18-10 24
           c6 6 10 14 10 24v24
           c0 10 8 18 18 18"
        fill="none"
        stroke="#35E3B1"
        stroke-width="10"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <path d="M182 64
           c10 0 18 8 18 18v24
           c0 10 4 18 10 24
           c-6 6-10 14-10 24v24
           c0 10-8 18-18 18"
        fill="none"
        stroke="#35E3B1"
        stroke-width="10"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- X -->
  <g transform="translate(128 128) rotate(0)">
    <path d="M-34 -34 L34 34" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <path d="M34 -34 L-34 34" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- XJSON text (optional, can remove this group for pure icon) -->
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
     font-size="28"
     font-weight="600"
     text-anchor="middle"
     fill="#FFFFFF">
    <text x="128" y="226" letter-spacing="4">XJSON</text>
  </g>
</svg>
