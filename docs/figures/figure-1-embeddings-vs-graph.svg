<svg width="800" height="280" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box { fill:#ffffff; stroke:#000000; stroke-width:1.5; }
    .text { font-family:Helvetica, Arial, sans-serif; font-size:13px; }
    .arrow { stroke:#000000; stroke-width:1.5; marker-end:url(#m); }
  </style>

  <defs>
    <marker id="m" markerWidth="10" markerHeight="10" refX="6" refY="3"
            orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#000" />
    </marker>
  </defs>

  <rect x="40" y="90" width="240" height="80" class="box"/>
  <text x="160" y="120" text-anchor="middle" class="text">Embedding Space</text>
  <text x="160" y="140" text-anchor="middle" class="text">(opaque)</text>

  <line x1="280" y1="130" x2="360" y2="130" class="arrow"/>

  <rect x="360" y="60" width="400" height="140" class="box"/>
  <text x="560" y="90" text-anchor="middle" class="text">Supgram Graph</text>
  <text x="560" y="115" text-anchor="middle" class="text">Explicit Nodes + Edges</text>
  <text x="560" y="140" text-anchor="middle" class="text">Deterministic Walk</text>
</svg>
