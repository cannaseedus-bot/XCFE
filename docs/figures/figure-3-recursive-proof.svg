<svg width="800" height="260" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box { fill:#fff; stroke:#000; stroke-width:1.5; }
    .arrow { stroke:#000; stroke-width:1.5; marker-end:url(#m); }
    .text { font-family:Helvetica; font-size:12px; }
  </style>

  <defs>
    <marker id="m" markerWidth="10" markerHeight="10" refX="6" refY="3"
            orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#000" />
    </marker>
  </defs>

  <rect x="40" y="80" width="120" height="60" class="box"/>
  <rect x="200" y="40" width="120" height="60" class="box"/>
  <rect x="200" y="120" width="120" height="60" class="box"/>
  <rect x="400" y="80" width="160" height="60" class="box"/>

  <text x="100" y="115" text-anchor="middle" class="text">Proof π₁</text>
  <text x="260" y="75" text-anchor="middle" class="text">Proof π₂</text>
  <text x="260" y="155" text-anchor="middle" class="text">Proof π₃</text>
  <text x="480" y="115" text-anchor="middle" class="text">Aggregated Proof Π*</text>

  <line x1="160" y1="110" x2="200" y2="70" class="arrow"/>
  <line x1="160" y1="110" x2="200" y2="150" class="arrow"/>
  <line x1="320" y1="70" x2="400" y2="110" class="arrow"/>
  <line x1="320" y1="150" x2="400" y2="110" class="arrow"/>
</svg>
