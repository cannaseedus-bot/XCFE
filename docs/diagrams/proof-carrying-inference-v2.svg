<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box { fill:#0b1220; stroke:#00f5ff; stroke-width:2; rx:10; }
    .text { fill:#e6fffa; font-family:Inter, monospace; font-size:14px; text-anchor:middle; }
    .label { fill:#7dd3fc; font-size:12px; }
    .arrow { stroke:#00f5ff; stroke-width:2; marker-end:url(#arrow); }
  </style>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#00f5ff"/>
    </marker>
  </defs>

  <rect x="60" y="160" width="200" height="80" class="box"/>
  <text x="160" y="195" class="text">QUERY</text>

  <rect x="320" y="160" width="220" height="80" class="box"/>
  <text x="430" y="185" class="text">GRAPH WALK</text>
  <text x="430" y="205" class="label">(deterministic)</text>

  <rect x="600" y="80" width="240" height="80" class="box"/>
  <text x="720" y="115" class="text">ANSWER</text>

  <rect x="600" y="240" width="240" height="100" class="box"/>
  <text x="720" y="270" class="text">PROOF ENVELOPE</text>
  <text x="720" y="290" class="label">paths • edges • legality</text>

  <line x1="260" y1="200" x2="320" y2="200" class="arrow"/>
  <line x1="540" y1="200" x2="600" y2="120" class="arrow"/>
  <line x1="540" y1="200" x2="600" y2="260" class="arrow"/>

  <text x="450" y="40" class="text" font-size="18">
    Inference emits results and reasons
  </text>
</svg>
