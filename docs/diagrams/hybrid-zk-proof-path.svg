<svg width="960" height="420" viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg">
  <style>
    .node {
      fill:#020617;
      stroke:#7dd3fc;
      stroke-width:3;
    }
    .label {
      fill:#e6fffa;
      font-family:Inter, monospace;
      font-size:13px;
      text-anchor:middle;
    }
    .edge-revealed {
      stroke:#16f2aa;
      stroke-width:5;
      fill:none;
    }
    .edge-hidden {
      stroke:#ffb703;
      stroke-width:4;
      stroke-dasharray:6 6;
      fill:none;
      filter: drop-shadow(0 0 6px rgba(255,183,3,0.8));
    }
    .legend {
      font-size:12px;
    }
  </style>

  <circle cx="160" cy="210" r="28" class="node"/>
  <circle cx="360" cy="120" r="28" class="node"/>
  <circle cx="360" cy="300" r="28" class="node"/>
  <circle cx="580" cy="210" r="32" class="node"/>
  <circle cx="800" cy="210" r="28" class="node"/>

  <text x="160" y="215" class="label">N1</text>
  <text x="360" y="125" class="label">N2</text>
  <text x="360" y="305" class="label">N3</text>
  <text x="580" y="215" class="label">N4</text>
  <text x="800" y="215" class="label">N5</text>

  <path d="M188 210 L332 140" class="edge-hidden"/>
  <path d="M188 210 L332 280" class="edge-hidden"/>

  <path d="M392 140 L548 210" class="edge-revealed"/>

  <path d="M612 210 L772 210" class="edge-hidden"/>

  <text x="480" y="40" class="label" font-size="18">
    Hybrid ZK Inference Proof
  </text>

  <g transform="translate(60,360)">
    <line x1="0" y1="0" x2="40" y2="0" class="edge-revealed"/>
    <text x="60" y="5" class="label legend">Revealed step</text>

    <line x1="200" y1="0" x2="240" y2="0" class="edge-hidden"/>
    <text x="260" y="5" class="label legend">Hidden (ZK)</text>
  </g>
</svg>
