<svg width="900" height="360" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box { fill:#0b1220; stroke:#16f2aa; stroke-width:2; rx:10; }
    .text { fill:#e6fffa; font-family:Inter, monospace; font-size:14px; text-anchor:middle; }
    .label { fill:#7dd3fc; font-size:12px; }
    .arrow { stroke:#16f2aa; stroke-width:2; marker-end:url(#arrow); }
  </style>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16f2aa"/>
    </marker>
  </defs>

  <rect x="40" y="120" width="200" height="80" class="box"/>
  <text x="140" y="155" class="text">XJSON FILE</text>
  <text x="140" y="175" class="label">Authority</text>

  <rect x="300" y="120" width="200" height="80" class="box"/>
  <text x="400" y="155" class="text">SCXQ2 GRAPH</text>
  <text x="400" y="175" class="label">State</text>

  <rect x="560" y="120" width="200" height="80" class="box"/>
  <text x="660" y="155" class="text">INFERENCE</text>
  <text x="660" y="175" class="label">Behavior</text>

  <line x1="240" y1="160" x2="300" y2="160" class="arrow"/>
  <line x1="500" y1="160" x2="560" y2="160" class="arrow"/>

  <text x="450" y="60" class="text" font-size="18">
    Structure → Legality → Execution
  </text>
</svg>
